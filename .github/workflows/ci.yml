name: Control-plane CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "29 6 * * *"
  workflow_dispatch:
    inputs:
      cmake_options:
        description: Space-separated CMake -D overrides
        required: false
        default: ""

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: "4"
  DISABLE_SENSITIVE_TESTS: "1"

jobs:
  integration:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04 | GCC 14 | Release
            blocks_sdk_tag: main-ubuntu-24.04-gcc14-release
            cxx: g++-14
            cmake_build_type: RelWithDebInfo
            cxx_flags: -Wno-error=null-dereference
            linker_flags: ""
            asan_options: ""
          - name: Ubuntu 26.04 | GCC | Release
            blocks_sdk_tag: main-ubuntu-26.04-gcc-release
            cxx: g++
            cmake_build_type: RelWithDebInfo
            cxx_flags: -Wno-error=null-dereference
            linker_flags: ""
            asan_options: ""
          - name: Ubuntu 26.04 | GCC | Debug
            blocks_sdk_tag: main-ubuntu-26.04-gcc-debug
            cxx: g++
            cmake_build_type: Debug
            cxx_flags: -Wno-error=null-dereference
            linker_flags: ""
            asan_options: ""
          - name: Ubuntu 24.04 | Clang 20 | Release
            blocks_sdk_tag: main-ubuntu-24.04-clang20-release
            cxx: clang++-20
            cmake_build_type: RelWithDebInfo
            cxx_flags: -fsanitize=address -Wno-error=deprecated-declarations
            linker_flags: -fsanitize=address
            asan_options: detect_leaks=0
          - name: Fedora 44 | Clang | Release
            blocks_sdk_tag: main-fedora-44-clang-release
            cxx: clang++
            cmake_build_type: RelWithDebInfo
            cxx_flags: -fsanitize=address -Wno-error=deprecated-declarations
            linker_flags: -fsanitize=address
            asan_options: detect_leaks=0
          - name: Fedora 44 | Clang | Debug
            # The Debug SDK currently aborts in GNU Radio's generated
            # gr::Resampling<> registration under libstdc++ assertions.
            # Keep this consumer build Debug while using the compatible SDK.
            blocks_sdk_tag: main-fedora-44-clang-release
            cxx: clang++
            sdk_build_type: RelWithDebInfo
            cmake_build_type: Debug
            cxx_flags: -fsanitize=address -Wno-error=deprecated-declarations
            linker_flags: -fsanitize=address
            asan_options: detect_leaks=0
          - name: Ubuntu 24.04 | Emscripten | Release
            blocks_sdk_tag: main-ubuntu-24.04-emscripten-release
            cxx: em++
            cmake_wrapper: emcmake
            cmake_build_type: Release
            cxx_flags: ""
            linker_flags: ""
            asan_options: ""
    container:
      image: ghcr.io/${{ github.repository_owner }}/gnuradio4-blocks-sdk:${{ matrix.blocks_sdk_tag }}

    env:
      CXX: ${{ matrix.cxx }}

    steps:
      - name: Check out control-plane
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The published main SDK predates native Runtime adoption (Core #224). Rebuild its Blocks revision against
      # the required Core so headers, libraries and registered plugins all use the same ABI.
      - name: Read Blocks SDK revision
        id: sdk_revision
        shell: bash
        run: |
          revision="$(sed -n 's/^git_sha=//p' /opt/gnuradio4/share/gnuradio4-blocks-sdk/manifest)"
          [[ "${revision}" =~ ^[0-9a-f]{40}$ ]]
          echo "blocks_ref=${revision}" >> "$GITHUB_OUTPUT"

      - name: Check out Core native runtime dependency
        uses: actions/checkout@v6
        with:
          repository: gnuradio/gnuradio4-core
          ref: 841c63721302041101996eb7ca8dd17200e8e5e7
          path: _ci/core
          persist-credentials: false

      - name: Check out matching Blocks source
        uses: actions/checkout@v6
        with:
          repository: gnuradio/gnuradio4-blocks
          ref: ${{ steps.sdk_revision.outputs.blocks_ref }}
          path: _ci/blocks
          persist-credentials: false

      - name: Build matching Core and Blocks SDK
        shell: bash
        env:
          CMAKE_WRAPPER: ${{ matrix.cmake_wrapper }}
          SDK_BUILD_TYPE: ${{ matrix.sdk_build_type || matrix.cmake_build_type }}
          SDK_CXX_FLAGS: ${{ matrix.cxx_flags }}
          SDK_LINKER_FLAGS: ${{ matrix.linker_flags }}
        run: bash .github/ci/build-native-runtime-sdk.sh _ci/core _ci/blocks ../build-sdk

      - name: Configure
        if: matrix.cmake_wrapper == null
        shell: bash
        env:
          CMAKE_OPTIONS: ${{ inputs.cmake_options }}
        run: |
          cmake_args=(
            -S .
            -B ../build
            -DCMAKE_COLOR_DIAGNOSTICS=ON
            "-DCMAKE_PREFIX_PATH=/opt/gr4cp-sdk;/opt/gnuradio4"
            -DGR4CP_GNURADIO4_PREFIX=/opt/gr4cp-sdk
            -DCMAKE_BUILD_TYPE=${{ matrix.cmake_build_type }}
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          )
          if [[ -n "${{ matrix.cxx_flags }}" ]]; then
            cmake_args+=("-DCMAKE_CXX_FLAGS=${{ matrix.cxx_flags }}")
          fi
          if [[ -n "${{ matrix.linker_flags }}" ]]; then
            cmake_args+=(
              "-DCMAKE_EXE_LINKER_FLAGS=${{ matrix.linker_flags }}"
              "-DCMAKE_SHARED_LINKER_FLAGS=${{ matrix.linker_flags }}"
            )
          fi
          if [[ -n "${CMAKE_OPTIONS}" ]]; then
            read -r -a overrides <<< "${CMAKE_OPTIONS}"
            cmake_args+=("${overrides[@]}")
          fi
          cmake "${cmake_args[@]}"

      - name: Check out gnuradio4-studio
        if: matrix.cmake_wrapper == 'emcmake'
        uses: actions/checkout@v6
        with:
          repository: gnuradio/gnuradio4-studio
          path: gnuradio4-studio

      - name: Build and install Studio blocks (Emscripten)
        if: matrix.cmake_wrapper == 'emcmake'
        shell: bash
        env:
          PKG_CONFIG_PATH: /opt/gr4cp-sdk/lib/pkgconfig:/opt/gr4cp-sdk/lib64/pkgconfig:/opt/gr4cp-sdk/share/pkgconfig:/opt/gnuradio4/lib/pkgconfig:/opt/gnuradio4/lib64/pkgconfig:/opt/gnuradio4/share/pkgconfig
        run: |
          if ! command -v pkg-config >/dev/null; then
            apt-get update && apt-get install -y --no-install-recommends pkg-config
          fi
          system_node="$(command -v node)"
          emcmake cmake -S gnuradio4-studio/blocks -B ../build-studio-blocks \
            -DCMAKE_COLOR_DIAGNOSTICS=ON \
            "-DCMAKE_PREFIX_PATH=/opt/gr4cp-sdk;/opt/gnuradio4" \
            "-DCMAKE_FIND_ROOT_PATH=/opt/gr4cp-sdk;/opt/gnuradio4" \
            -DCMAKE_CROSSCOMPILING_EMULATOR="${system_node}" \
            -DCMAKE_INSTALL_PREFIX=/opt/gr4cp-sdk \
            -DCMAKE_BUILD_TYPE=${{ matrix.cmake_build_type }}
          cmake --build ../build-studio-blocks --parallel 4
          cmake --install ../build-studio-blocks

      - name: Configure CMake Emscripten
        if: matrix.cmake_wrapper == 'emcmake'
        shell: bash
        run: |
          system_node="$(command -v node)"
          emcmake cmake -S . -B ../build \
            -DCMAKE_COLOR_DIAGNOSTICS=ON \
            "-DCMAKE_PREFIX_PATH=/opt/gr4cp-sdk;/opt/gnuradio4" \
            "-DCMAKE_FIND_ROOT_PATH=/opt/gr4cp-sdk;/opt/gnuradio4" \
            -DGR4CP_GNURADIO4_PREFIX=/opt/gr4cp-sdk \
            -DCMAKE_CROSSCOMPILING_EMULATOR="${system_node}" \
            -DCMAKE_BUILD_TYPE=${{ matrix.cmake_build_type }} \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: cmake --build ../build --parallel 4

      - name: Verify WASM module
        if: matrix.cmake_wrapper == 'emcmake'
        run: |
          test -s ../build/gr4cp_wasm.mjs
          test -s ../build/gr4cp_wasm.wasm

      - name: Execute tests
        if: matrix.cmake_wrapper == null
        env:
          ASAN_OPTIONS: ${{ matrix.asan_options }}
        run: ctest --test-dir ../build --output-on-failure
